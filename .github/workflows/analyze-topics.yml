name: Analyze Topics

on:
  push:
    branches: [main]
    paths: ['web.json']
  pull_request:
    branches: [main]
    paths: ['web.json']

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the PR head ref so the commit goes back to the right branch
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate topics.json
        run: npm run analyze

      - name: Commit updated topics.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/topics.json
          if git diff --cached --quiet; then
            echo "topics.json is already up-to-date, nothing to commit."
          else
            git commit -m "chore: update topics.json [skip ci]"
            git push
          fi
